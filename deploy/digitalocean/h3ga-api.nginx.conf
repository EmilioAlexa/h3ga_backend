# Replace REPLACE_WITH_REAL_API_DOMAIN before enabling this site.
# This valid HTTP bootstrap is temporarily available until Certbot installs
# the HTTPS listener and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_WITH_REAL_API_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /api/ {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
